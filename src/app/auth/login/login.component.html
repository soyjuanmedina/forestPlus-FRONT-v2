<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>{{ 'LOGIN.TITLE' | translate }}</h2>
      <p>{{ 'LOGIN.SUBTITLE' | translate }}</p>
    </div>

    <!-- Mensajes de éxito y error -->
    <div *ngIf="successMessage" class="alert alert-success">
      {{ 'LOGIN.' + successMessage | translate }}
    </div>
    <div *ngIf="errorMessage" class="alert alert-error" style="display: flex; flex-direction: column; align-items: center;">
      <span>{{ 'LOGIN.' + errorMessage | translate }}</span>
      
      <button *ngIf="errorAction === 'resend'" (click)="onResendVerification()" class="alert-action-btn">
        {{ 'LOGIN.RESEND_EMAIL' | translate }}
      </button>

      <button *ngIf="errorAction === 'reset'" (click)="onResetPassword()" class="alert-action-btn">
        {{ 'LOGIN.RESET_PASSWORD' | translate }}
      </button>

      <button *ngIf="errorAction === 'unlock'" (click)="onUnlockAccount()" class="alert-action-btn">
        {{ 'LOGIN.UNLOCK_ACCOUNT' | translate }}
      </button>
    </div>

    <div class="auth-form">
      <div class="form-group">
        <label for="email" class="form-label">{{ 'LOGIN.EMAIL' | translate }}</label>
        <input type="email" id="email" class="form-control"
          [placeholder]="'LOGIN.EMAIL_PLACEHOLDER' | translate" [(ngModel)]="email" name="email"
          required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">{{ 'LOGIN.PASSWORD' | translate }}</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••"
          [(ngModel)]="password" name="password" required (keyup.enter)="onSubmit()">
      </div>

      <div class="form-actions">
        <button type="button" (click)="onSubmit()" class="btn btn-primary w-100">{{ 'LOGIN.BUTTON' |
          translate }}</button>
      </div>
    </div>

    <div class="auth-footer" *ngIf="features.registration">
      <p>{{ 'LOGIN.NO_ACCOUNT' | translate }} <a routerLink="/register">{{ 'LOGIN.REGISTER' |
          translate }}</a></p>
    </div>

    <div *ngIf="!features.registration">
      <app-request-access></app-request-access>
    </div>
    <div class="footer-actions">
      <a routerLink="/" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> {{ 'COMMON.BACK' | translate }}
      </a>
    </div>
  </div>
</div>
